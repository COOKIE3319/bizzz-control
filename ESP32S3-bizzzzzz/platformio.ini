; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; 曲谱文件系统：data/ 目录 -> 板载 LittleFS
; 板子实际是 16MB flash：自定义分区 4MB app + ~12MB 文件系统
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB

; 板子通过原生 USB-Serial/JTAG 连接（/dev/cu.usbmodem101）。
; 板子定义里 ARDUINO_USB_MODE=1，但默认没开 CDC On Boot，Serial 会映射到 UART0
; （GPIO43/44，没接到 USB），所以串口监视器里看不到 Serial 输出。
; 打开这个宏后 Serial 走板载 USB CDC，pio device monitor 就能看到日志。
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; 串口设备：Mac 上一般是 /dev/cu.usbmodem* ，Linux 上 /dev/ttyACM* 。
; PlatformIO 会自动检测；多设备时再取消注释指定：
; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
upload_speed = 921600
